# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Config version for compatibility and deprecations
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = ['exec-and-forget brew services restart sketchybar']

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 20

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config version is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
persistent-workspaces = ["a1", "a2", "a3", "a4", "a5", "a6"]

# Hooks

exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

on-focus-changed = ['exec-and-forget sketchybar --trigger aerospace_mode_changed']
on-mode-changed = ['exec-and-forget sketchybar --trigger aerospace_mode_changed']

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = [
{ monitor."built-in" = 4 },
8
]
inner.vertical = [
{ monitor."built-in" = 4 },
8
]
outer.left = [
{ monitor."built-in" = 4 },
8
]
outer.bottom = [
{ monitor."built-in" = 4 },
8
]
outer.top = [
{ monitor."built-in" = 4 },
38
]
outer.right = [
{ monitor."built-in" = 4 },
8
]

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]
# alt-h = 'focus --boundaries all-monitors-outer-frame left'
# alt-l = 'focus --boundaries all-monitors-outer-frame right'
# alt-h = 'focus left --boundaries-action wrap-around-the-workspace'
# alt-l = 'focus right --boundaries-action wrap-around-the-workspace'
alt-h = 'focus left'
alt-l = 'focus right'
alt-j = 'focus down --boundaries-action wrap-around-the-workspace'
alt-k = 'focus up --boundaries-action wrap-around-the-workspace'

# Swap the focused window with its neighbor within the same workspace
ctrl-alt-h = 'move left'
ctrl-alt-l = 'move right'
ctrl-alt-j = 'move down'
ctrl-alt-k = 'move up'

# Toggle the focused workspace's layout between tiles and accordion
alt-t = 'layout tiles accordion'

# Jump directly to a workspace: 1-3 = a1-a3 (external/coding), 4-6 = a4-a6 (laptop/browser)
alt-1 = 'workspace a1'
alt-2 = 'workspace a2'
alt-3 = 'workspace a3'
alt-4 = 'workspace a4'
alt-5 = 'workspace a5'
alt-6 = 'workspace a6'

# Move the focused window to a workspace and follow it there
shift-alt-1 = ['move-node-to-workspace a1', 'workspace a1']
shift-alt-2 = ['move-node-to-workspace a2', 'workspace a2']
shift-alt-3 = ['move-node-to-workspace a3', 'workspace a3']
shift-alt-4 = ['move-node-to-workspace a4', 'workspace a4']
shift-alt-5 = ['move-node-to-workspace a5', 'workspace a5']
shift-alt-6 = ['move-node-to-workspace a6', 'workspace a6']

alt-r = 'mode resize'

[mode.resize.binding]
minus = "resize smart -50"
shift-equal = "resize smart +50"
equal = "balance-sizes"
esc = "mode main"
ctrl-c = "mode main"
enter = "mode main"

# make all windows float by default
# [[on-window-detected]]
# check-further-callbacks = true
# run = "layout accordion"

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = "layout floating"

# [[on-window-detected]]
# if.app-id = 'pl.maketheweb.cleanshotx'
# run = "layout floating"

[[on-window-detected]]
if.app-id = 'com.brnbw.Tuna'
run = "layout floating"

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = "layout floating"

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = "layout floating"

[[on-window-detected]]
if.app-id = 'com.sindresorhus.Plain-Text-Editor'
run = "layout floating"

[[on-window-detected]]
if.app-id = 'to.holepunch.runtime'
run = "layout floating"

[[on-window-detected]]
if.app-id = 'com.github.Electron'
run = "layout floating"

[[on-window-detected]]
if.app-id = 'com.brnbw.Poof'
run = "layout floating"

[[on-window-detected]]
if.app-id = 'com.brnbw.Egomaxxing'
run = "layout floating"

[workspace-to-monitor-force-assignment]
# Coding workspaces -> external monitor
a1 = "24QHDMIQCCYP"
a2 = "24QHDMIQCCYP"
a3 = "24QHDMIQCCYP"
# Chrome / reference / lecture workspaces -> built-in laptop screen
a4 = "built-in"
a5 = "built-in"
a6 = "built-in"

# vim: ft=toml
